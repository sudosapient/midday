<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Midday sign-in code</title>
  </head>
  <body style="margin:0;background:#f5f5f4;font-family:Arial,sans-serif;color:#1c1917">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding:40px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="max-width:480px;background:#ffffff;border:1px solid #e7e5e4;border-radius:12px"
          >
            <tr>
              <td style="padding:32px">
                <h1 style="margin:0 0 12px;font-size:24px;line-height:32px">
                  Your sign-in code
                </h1>
                <p style="margin:0 0 24px;color:#57534e;font-size:16px;line-height:24px">
                  Enter this six-digit code in Midday:
                </p>
                <div
                  style="padding:18px 20px;background:#f5f5f4;border-radius:8px;text-align:center;font-family:monospace;font-size:32px;font-weight:700;letter-spacing:8px"
                >
                  {{ .Token }}
                </div>
                <p style="margin:24px 0 0;color:#78716c;font-size:13px;line-height:20px">
                  This code expires shortly and can only be used once. If you
                  did not request it, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
